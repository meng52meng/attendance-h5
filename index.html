<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>办公室部考勤</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f0f4f8;min-height:100vh;color:#1a2332}
/* 科技感背景 */
.bg-decoration{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.bg-decoration::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 20% 30%,rgba(59,130,246,0.06) 0%,transparent 40%),radial-gradient(circle at 80% 70%,rgba(99,102,241,0.06) 0%,transparent 40%);animation:float 20s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-20px,20px) rotate(1deg)}}
.grid-lines{position:absolute;width:100%;height:100%;background-image:linear-gradient(rgba(59,130,246,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,0.03) 1px,transparent 1px);background-size:40px 40px}
.container{max-width:480px;margin:0 auto;padding:20px 16px;position:relative;z-index:1}
/* 页面切换 */
.page{display:none;animation:fadeIn 0.3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* 首页 */
.home{text-align:center;padding-top:60px}
.logo-icon{width:80px;height:80px;margin:0 auto 20px;background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 8px 24px rgba(59,130,246,0.3);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
h1.title{font-size:32px;font-weight:700;background:linear-gradient(135deg,#1e293b,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:2px}
.subtitle{color:#64748b;font-size:14px;margin-bottom:50px}
.btn-group{display:flex;gap:16px;justify-content:center}
.btn-primary{flex:1;max-width:160px;padding:16px 24px;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none;border-radius:12px;font-size:18px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(59,130,246,0.3);transition:all 0.2s}
.btn-primary:active{transform:scale(0.96);box-shadow:0 2px 6px rgba(59,130,246,0.2)}
.btn-secondary{flex:1;max-width:160px;padding:16px 24px;background:#fff;color:#3b82f6;border:2px solid #3b82f6;border-radius:12px;font-size:18px;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn-secondary:active{transform:scale(0.96);background:#eff6ff}
/* 返回按钮 */
.back-btn{position:fixed;top:16px;right:16px;z-index:100;padding:8px 16px;background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);border:1px solid #e2e8f0;border-radius:20px;color:#3b82f6;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
/* 记录页 */
.form-title{font-size:24px;font-weight:700;color:#1e293b;margin:60px 0 20px;text-align:center}
.radio-group{display:flex;gap:12px;margin-bottom:24px}
.radio-item{flex:1;padding:14px;text-align:center;background:#fff;border:2px solid #e2e8f0;border-radius:12px;cursor:pointer;transition:all 0.2s;font-size:16px;font-weight:600;color:#64748b}
.radio-item.selected{border-color:#3b82f6;background:#eff6ff;color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.form-container{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,0.05);border:1px solid #e2e8f0}
.form-item{margin-bottom:16px}
.form-label{display:block;font-size:14px;font-weight:600;color:#334155;margin-bottom:6px}
.form-input,.form-textarea{width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:16px;background:#f8fafc;transition:border-color 0.2s;-webkit-appearance:none}
.form-input:focus,.form-textarea:focus{outline:none;border-color:#3b82f6;background:#fff}
.form-textarea{min-height:80px;resize:vertical;font-family:inherit}
.submit-btn{width:100%;padding:16px;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none;border-radius:12px;font-size:18px;font-weight:600;cursor:pointer;margin-top:8px;box-shadow:0 4px 12px rgba(59,130,246,0.3)}
.submit-btn:active{transform:scale(0.98)}
/* 查看页 */
.view-tabs{display:flex;gap:8px;margin:60px 0 20px}
.view-tab{flex:1;padding:12px 8px;text-align:center;background:#fff;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:15px;font-weight:600;color:#64748b;transition:all 0.2s}
.view-tab.active{border-color:#3b82f6;background:#eff6ff;color:#3b82f6}
.panel{display:none}
.panel.active{display:block;animation:fadeIn 0.3s ease}
.table-wrap{overflow-x:auto;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.04);border:1px solid #e2e8f0;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:500px}
th{background:#f1f5f9;padding:12px 10px;text-align:left;font-weight:600;color:#334155;white-space:nowrap;border-bottom:2px solid #e2e8f0}
td{padding:12px 10px;border-bottom:1px solid #f1f5f9;color:#475569;vertical-align:top}
tr.deleted td{color:#cbd5e1;background:#fafafa}
.deleted-tag{color:#94a3b8;font-size:12px;margin-left:4px}
.admin-actions{white-space:nowrap}
.admin-btn{padding:4px 10px;margin:2px;border:none;border-radius:6px;font-size:12px;cursor:pointer}
.btn-edit{background:#eff6ff;color:#3b82f6}
.btn-del{background:#fef2f2;color:#ef4444}
.empty-state{text-align:center;padding:60px 20px;color:#94a3b8;font-size:16px}
.search-box{display:flex;gap:10px;margin-bottom:16px}
.search-input{flex:1;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:16px;background:#fff}
.search-btn{padding:12px 24px;background:#3b82f6;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.export-area{margin:20px 0;display:flex;flex-direction:column;gap:10px}
.export-btn{padding:14px;background:#059669;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
.export-btn.admin{background:#7c3aed}
.admin-entry{text-align:center;margin:40px 0 20px}
.admin-link{font-size:12px;color:#cbd5e1;cursor:pointer;user-select:none;padding:8px}
.admin-link:active{color:#94a3b8}
/* 弹窗 */
.modal-mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex;animation:fadeIn 0.2s ease}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
.modal-title{font-size:18px;font-weight:700;color:#1e293b;margin-bottom:16px;text-align:center}
.modal-input{width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:16px;margin-bottom:16px;background:#f8fafc}
.modal-input:focus{outline:none;border-color:#3b82f6;background:#fff}
.modal-btns{display:flex;gap:10px}
.modal-btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
.btn-confirm{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff}
.btn-cancel{background:#f1f5f9;color:#64748b}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:14px 28px;border-radius:10px;font-size:16px;z-index:2000;display:none}
.toast.show{display:block;animation:fadeIn 0.2s ease}
/* 管理员已解锁标识 */
.admin-badge{position:fixed;top:16px;left:16px;z-index:100;padding:4px 12px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border-radius:20px;font-size:12px;font-weight:600;display:none;box-shadow:0 2px 8px rgba(124,58,237,0.3)}
.admin-badge.show{display:block}
</style>
</head>
<body>
<div class="bg-decoration"><div class="grid-lines"></div></div>

<!-- 弹窗区域 -->
<div class="modal-mask" id="nameModal">
  <div class="modal">
    <div class="modal-title">您是谁？</div>
    <input type="text" class="modal-input" id="nameInput" placeholder="请输入您的名字" maxlength="20">
    <div class="modal-btns">
      <button class="modal-btn btn-confirm" onclick="saveName()">确定</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="welcomeModal">
  <div class="modal">
    <div class="modal-title" id="welcomeText">欢迎您</div>
    <div class="modal-btns">
      <button class="modal-btn btn-confirm" onclick="closeWelcome()">确定</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="pwdModal">
  <div class="modal">
    <div class="modal-title">请输入管理员密码</div>
    <input type="password" class="modal-input" id="pwdInput" placeholder="密码" maxlength="30">
    <div class="modal-btns">
      <button class="modal-btn btn-cancel" onclick="closePwdModal()">取消</button>
      <button class="modal-btn btn-confirm" onclick="checkPwd()">确定</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="editModal">
  <div class="modal" style="max-width:360px">
    <div class="modal-title">编辑记录</div>
    <div id="editForm"></div>
    <div class="modal-btns">
      <button class="modal-btn btn-cancel" onclick="closeEdit()">取消</button>
      <button class="modal-btn btn-confirm" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="delModal">
  <div class="modal">
    <div class="modal-title">确定标记这条记录为已删除吗？</div>
    <div class="modal-btns">
      <button class="modal-btn btn-cancel" onclick="closeDel()">取消</button>
      <button class="modal-btn btn-confirm" style="background:#ef4444" onclick="confirmDel()">确定删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 首页 -->
<div class="page active" id="pageHome">
  <div class="container">
    <div class="home">
      <div class="logo-icon">📋</div>
      <h1 class="title">办公室部考勤</h1>
      <p class="subtitle">智能考勤管理系统</p>
      <div class="btn-group">
        <button class="btn-primary" onclick="goPage('pageRecord')">📝 记录</button>
        <button class="btn-secondary" onclick="goPage('pageView')">📊 查看</button>
      </div>
    </div>
  </div>
</div>

<!-- 记录页 -->
<div class="page" id="pageRecord">
  <button class="back-btn" onclick="goPage('pageHome')">← 返回</button>
  <div class="container">
    <div class="form-title">输入</div>
    <div class="radio-group">
      <div class="radio-item selected" id="radioLate" onclick="selectType('late')">迟到记录</div>
      <div class="radio-item" id="radioKnock" onclick="selectType('knock')">敲门记录</div>
    </div>

    <!-- 迟到表单 -->
    <div class="form-container" id="formLate">
      <div class="form-item">
        <label class="form-label">日期 *</label>
        <input type="text" class="form-input" id="lateDate" placeholder="例如：2026.11.18">
      </div>
      <div class="form-item">
        <label class="form-label">第几班</label>
        <input type="text" class="form-input" id="lateShift" placeholder="例如：晚班">
      </div>
      <div class="form-item">
        <label class="form-label">姓名 *</label>
        <input type="text" class="form-input" id="lateName" placeholder="请输入姓名">
      </div>
      <div class="form-item">
        <label class="form-label">迟到原因</label>
        <textarea class="form-textarea" id="lateReason" placeholder="请输入迟到原因"></textarea>
      </div>
      <button class="submit-btn" onclick="submitLate()">提交</button>
    </div>

    <!-- 敲门表单 -->
    <div class="form-container" id="formKnock" style="display:none">
      <div class="form-item">
        <label class="form-label">日期 *</label>
        <input type="text" class="form-input" id="knockDate" placeholder="例如：2026.11.18">
      </div>
      <div class="form-item">
        <label class="form-label">值班人 *</label>
        <input type="text" class="form-input" id="knockDuty" placeholder="请输入值班人姓名">
      </div>
      <div class="form-item">
        <label class="form-label">开门情况</label>
        <textarea class="form-textarea" id="knockOpen" placeholder="正门侧门是否开门、是否询问来意"></textarea>
      </div>
      <div class="form-item">
        <label class="form-label">是否及时联系正部长</label>
        <input type="text" class="form-input" id="knockContact" placeholder="是/否">
      </div>
      <div class="form-item">
        <label class="form-label">第几次</label>
        <input type="text" class="form-input" id="knockTimes" placeholder="自动计算" readonly style="background:#e2e8f0;color:#64748b">
      </div>
      <button class="submit-btn" onclick="submitKnock()">提交</button>
    </div>
  </div>
</div>

<!-- 查看页 -->
<div class="page" id="pageView">
  <button class="back-btn" onclick="goPage('pageHome')">← 返回</button>
  <div class="admin-badge" id="adminBadge">🔐 管理员</div>
  <div class="container">
    <div class="view-tabs">
      <div class="view-tab active" onclick="switchTab('knock',this)">敲门</div>
      <div class="view-tab" onclick="switchTab('late',this)">迟到</div>
      <div class="view-tab" onclick="switchTab('date',this)">日期</div>
    </div>

    <!-- 敲门面板 -->
    <div class="panel active" id="panelKnock">
      <div id="knockList"></div>
      <div class="export-area">
        <button class="export-btn" onclick="exportData('knock')">📥 导出Excel（敲门台账）</button>
      </div>
    </div>

    <!-- 迟到面板 -->
    <div class="panel" id="panelLate">
      <div id="lateList"></div>
      <div class="export-area">
        <button class="export-btn" onclick="exportData('late')">📥 导出Excel（迟到台账）</button>
      </div>
    </div>

    <!-- 日期面板 -->
    <div class="panel" id="panelDate">
      <div class="search-box">
        <input type="text" class="search-input" id="searchDate" placeholder="输入日期，如 2026.11.18">
        <button class="search-btn" onclick="searchByDate()">查询</button>
      </div>
      <div id="dateResult"></div>
    </div>

    <div class="admin-entry">
      <span class="admin-link" onclick="openPwd()">管理</span>
    </div>
  </div>
</div>

<script>
const API = '/api';
let isAdmin = false;
let currentTab = 'knock';
let allData = {knock:[],late:[]};
let editingRecord = null;
let deletingRecord = null;

// 初始化
window.onload = function(){
  checkIdentity();
  loadData();
};

// 身份识别
function checkIdentity(){
  const name = localStorage.getItem('attendance_name');
  if(name){
    document.getElementById('welcomeText').textContent = '欢迎您，' + name;
    document.getElementById('welcomeModal').classList.add('show');
  } else {
    document.getElementById('nameModal').classList.add('show');
  }
}

function saveName(){
  const v = document.getElementById('nameInput').value.trim();
  if(!v){ showToast('请输入名字'); return; }
  localStorage.setItem('attendance_name', v);
  document.getElementById('nameModal').classList.remove('show');
  showToast('保存成功');
}

function closeWelcome(){
  document.getElementById('welcomeModal').classList.remove('show');
}

// 页面切换
function goPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='pageView'){ loadData(); }
}

// 记录类型切换
function selectType(t){
  document.getElementById('radioLate').classList.toggle('selected', t==='late');
  document.getElementById('radioKnock').classList.toggle('selected', t==='knock');
  document.getElementById('formLate').style.display = t==='late'?'block':'none';
  document.getElementById('formKnock').style.display = t==='knock'?'block':'none';
  if(t==='knock'){ autoCalcTimes(); }
}

// 自动计算第几次
async function autoCalcTimes(){
  const duty = document.getElementById('knockDuty').value.trim();
  if(!duty){ document.getElementById('knockTimes').value=''; return; }
  try{
    const res = await fetch(API+'/knock/count?duty='+encodeURIComponent(duty));
    const d = await res.json();
    document.getElementById('knockTimes').value = d.count + 1;
  }catch(e){}
}
document.getElementById('knockDuty').addEventListener('blur', autoCalcTimes);

// 提交迟到
async function submitLate(){
  const date = document.getElementById('lateDate').value.trim();
  const shift = document.getElementById('lateShift').value.trim();
  const name = document.getElementById('lateName').value.trim();
  const reason = document.getElementById('lateReason').value.trim();
  if(!date){ showToast('日期不能为空'); return; }
  if(!name){ showToast('姓名不能为空'); return; }
  try{
    const res = await fetch(API+'/late',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({date,shift,name,reason})
    });
    if(res.ok){
      showToast('提交成功');
      document.getElementById('lateDate').value='';
      document.getElementById('lateShift').value='';
      document.getElementById('lateName').value='';
      document.getElementById('lateReason').value='';
    }
  }catch(e){ showToast('提交失败，请检查网络'); }
}

// 提交敲门
async function submitKnock(){
  const date = document.getElementById('knockDate').value.trim();
  const duty = document.getElementById('knockDuty').value.trim();
  const open = document.getElementById('knockOpen').value.trim();
  const contact = document.getElementById('knockContact').value.trim();
  const times = document.getElementById('knockTimes').value.trim();
  if(!date){ showToast('日期不能为空'); return; }
  if(!duty){ showToast('值班人不能为空'); return; }
  try{
    const res = await fetch(API+'/knock',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({date,duty,open,contact,times})
    });
    if(res.ok){
      showToast('提交成功');
      document.getElementById('knockDate').value='';
      document.getElementById('knockDuty').value='';
      document.getElementById('knockOpen').value='';
      document.getElementById('knockContact').value='';
      document.getElementById('knockTimes').value='';
    }
  }catch(e){ showToast('提交失败，请检查网络'); }
}

// 查看页切换
function switchTab(tab, el){
  currentTab = tab;
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active');
  if(tab!=='date'){ renderTable(tab); }
}

// 加载数据
async function loadData(){
  try{
    const res = await fetch(API+'/records');
    allData = await res.json();
    if(currentTab!=='date'){ renderTable(currentTab); }
  }catch(e){}
}

// 渲染表格
function renderTable(type){
  const container = document.getElementById(type+'List');
  let records = allData[type] || [];
  if(!isAdmin){ records = records.filter(r=>!r.deleted); }
  records.sort((a,b)=>b.id-a.id);

  if(records.length===0){
    container.innerHTML = '<div class="empty-state">暂无记录</div>';
    return;
  }

  let html = '<div class="table-wrap"><table><thead><tr>';
  if(type==='knock'){
    html += '<th>日期</th><th>值班人</th><th>开门情况</th><th>联系部长</th><th>第几次</th>';
  } else {
    html += '<th>日期</th><th>第几班</th><th>姓名</th><th>迟到原因</th>';
  }
  if(isAdmin){ html += '<th>操作</th>'; }
  html += '</tr></thead><tbody>';

  records.forEach(r=>{
    const delClass = r.deleted ? ' class="deleted"' : '';
    const delTag = r.deleted ? '<span class="deleted-tag">（已删除）</span>' : '';
    html += '<tr'+delClass+'>';
    if(type==='knock'){
      html += '<td>'+esc(r.date)+delTag+'</td><td>'+esc(r.duty)+'</td><td>'+esc(r.open)+'</td><td>'+esc(r.contact)+'</td><td>'+esc(r.times)+'</td>';
    } else {
      html += '<td>'+esc(r.date)+delTag+'</td><td>'+esc(r.shift)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.reason)+'</td>';
    }
    if(isAdmin && !r.deleted){
      html += '<td class="admin-actions"><button class="admin-btn btn-edit" onclick="openEdit(\''+type+'\','+r.id+')">编辑</button><button class="admin-btn btn-del" onclick="openDel(\''+type+'\','+r.id+')">标记删除</button></td>';
    } else if(isAdmin && r.deleted){
      html += '<td class="admin-actions"><span style="color:#cbd5e1;font-size:12px">已标记</span></td>';
    }
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  container.innerHTML = html;
}

// 日期查询
function searchByDate(){
  const date = document.getElementById('searchDate').value.trim();
  const container = document.getElementById('dateResult');
  if(!date){ showToast('请输入日期'); return; }

  let knock = (allData.knock||[]).filter(r=>r.date===date);
  let late = (allData.late||[]).filter(r=>r.date===date);
  if(!isAdmin){
    knock = knock.filter(r=>!r.deleted);
    late = late.filter(r=>!r.deleted);
  }

  if(knock.length===0 && late.length===0){
    container.innerHTML = '<div class="empty-state">当日无情况</div>';
    return;
  }

  let html = '';
  if(late.length>0){
    html += '<h3 style="margin:16px 0 8px;color:#334155">迟到记录</h3>';
    html += '<div class="table-wrap"><table><thead><tr><th>日期</th><th>第几班</th><th>姓名</th><th>迟到原因</th></tr></thead><tbody>';
    late.forEach(r=>{
      const delClass = r.deleted?' class="deleted"':'';
      const delTag = r.deleted?'<span class="deleted-tag">（已删除）</span>':'';
      html += '<tr'+delClass+'><td>'+esc(r.date)+delTag+'</td><td>'+esc(r.shift)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.reason)+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  if(knock.length>0){
    html += '<h3 style="margin:16px 0 8px;color:#334155">敲门记录</h3>';
    html += '<div class="table-wrap"><table><thead><tr><th>日期</th><th>值班人</th><th>开门情况</th><th>联系部长</th><th>第几次</th></tr></thead><tbody>';
    knock.forEach(r=>{
      const delClass = r.deleted?' class="deleted"':'';
      const delTag = r.deleted?'<span class="deleted-tag">（已删除）</span>':'';
      html += '<tr'+delClass+'><td>'+esc(r.date)+delTag+'</td><td>'+esc(r.duty)+'</td><td>'+esc(r.open)+'</td><td>'+esc(r.contact)+'</td><td>'+esc(r.times)+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  container.innerHTML = html;
}

// 管理员
function openPwd(){
  document.getElementById('pwdModal').classList.add('show');
  document.getElementById('pwdInput').value='';
}
function closePwdModal(){
  document.getElementById('pwdModal').classList.remove('show');
}
function checkPwd(){
  const pwd = document.getElementById('pwdInput').value;
  if(pwd === 'bangongshi'){
    isAdmin = true;
    document.getElementById('pwdModal').classList.remove('show');
    document.getElementById('adminBadge').classList.add('show');
    showToast('管理员已解锁');
    if(currentTab!=='date'){ renderTable(currentTab); }
  } else {
    showToast('密码错误');
    document.getElementById('pwdModal').classList.remove('show');
  }
}

// 编辑
function openEdit(type,id){
  const records = allData[type]||[];
  editingRecord = records.find(r=>r.id===id);
  if(!editingRecord || editingRecord.deleted) return;
  let html = '';
  if(type==='knock'){
    html = '<div class="form-item"><label class="form-label">日期</label><input class="form-input" id="editDate" value="'+esc(editingRecord.date)+'"></div>';
    html += '<div class="form-item"><label class="form-label">值班人</label><input class="form-input" id="editDuty" value="'+esc(editingRecord.duty)+'"></div>';
    html += '<div class="form-item"><label class="form-label">开门情况</label><textarea class="form-textarea" id="editOpen">'+esc(editingRecord.open)+'</textarea></div>';
    html += '<div class="form-item"><label class="form-label">是否及时联系正部长</label><input class="form-input" id="editContact" value="'+esc(editingRecord.contact)+'"></div>';
    html += '<div class="form-item"><label class="form-label">第几次</label><input class="form-input" id="editTimes" value="'+esc(editingRecord.times)+'"></div>';
  } else {
    html = '<div class="form-item"><label class="form-label">日期</label><input class="form-input" id="editDate" value="'+esc(editingRecord.date)+'"></div>';
    html += '<div class="form-item"><label class="form-label">第几班</label><input class="form-input" id="editShift" value="'+esc(editingRecord.shift)+'"></div>';
    html += '<div class="form-item"><label class="form-label">姓名</label><input class="form-input" id="editName" value="'+esc(editingRecord.name)+'"></div>';
    html += '<div class="form-item"><label class="form-label">迟到原因</label><textarea class="form-textarea" id="editReason">'+esc(editingRecord.reason)+'</textarea></div>';
  }
  document.getElementById('editForm').innerHTML = html;
  document.getElementById('editModal').classList.add('show');
}
function closeEdit(){
  document.getElementById('editModal').classList.remove('show');
  editingRecord = null;
}
async function saveEdit(){
  if(!editingRecord) return;
  const type = allData.knock.includes(editingRecord) ? 'knock' : 'late';
  let data = {};
  if(type==='knock'){
    data = {
      date: document.getElementById('editDate').value.trim(),
      duty: document.getElementById('editDuty').value.trim(),
      open: document.getElementById('editOpen').value.trim(),
      contact: document.getElementById('editContact').value.trim(),
      times: document.getElementById('editTimes').value.trim()
    };
  } else {
    data = {
      date: document.getElementById('editDate').value.trim(),
      shift: document.getElementById('editShift').value.trim(),
      name: document.getElementById('editName').value.trim(),
      reason: document.getElementById('editReason').value.trim()
    };
  }
  try{
    const res = await fetch(API+'/'+type+'/'+editingRecord.id,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    });
    if(res.ok){
      showToast('修改成功');
      closeEdit();
      await loadData();
    }
  }catch(e){ showToast('修改失败'); }
}

// 标记删除
function openDel(type,id){
  deletingRecord = {type,id};
  document.getElementById('delModal').classList.add('show');
}
function closeDel(){
  document.getElementById('delModal').classList.remove('show');
  deletingRecord = null;
}
async function confirmDel(){
  if(!deletingRecord) return;
  try{
    const res = await fetch(API+'/'+deletingRecord.type+'/'+deletingRecord.id+'/delete',{
      method:'POST'
    });
    if(res.ok){
      showToast('已标记删除');
      closeDel();
      await loadData();
    }
  }catch(e){ showToast('操作失败'); }
}

// 导出Excel
function exportData(type){
  let records = allData[type]||[];
  let filename = '';
  if(type==='knock'){
    if(!isAdmin){ records = records.filter(r=>!r.deleted); filename='敲门台账.xlsx'; }
    else {
      const all = confirm('点击"确定"导出全部（含已删除），点击"取消"仅导出有效记录');
      if(!all) records = records.filter(r=>!r.deleted);
      filename = all ? '敲门台账_全部.xlsx' : '敲门台账_有效.xlsx';
    }
    const data = records.map(r=>({日期:r.date,值班人:r.duty,开门情况:r.open,是否及时联系正部长:r.contact,第几次:r.times,状态:r.deleted?'已删除':'有效'}));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'敲门台账');
    XLSX.writeFile(wb,filename);
  } else {
    if(!isAdmin){ records = records.filter(r=>!r.deleted); filename='迟到台账.xlsx'; }
    else {
      const all = confirm('点击"确定"导出全部（含已删除），点击"取消"仅导出有效记录');
      if(!all) records = records.filter(r=>!r.deleted);
      filename = all ? '迟到台账_全部.xlsx' : '迟到台账_有效.xlsx';
    }
    const data = records.map(r=>({日期:r.date,第几班:r.shift,姓名:r.name,迟到原因:r.reason,状态:r.deleted?'已删除':'有效'}));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'迟到台账');
    XLSX.writeFile(wb,filename);
  }
}

// 工具
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
